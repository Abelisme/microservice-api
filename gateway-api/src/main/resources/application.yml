server:
  port: 8080

eureka:
  client:
    serviceUrl:
      register-with-eureka: true
      fetch-registry: true
      defaultZone: http://localhost:8761/eureka/
spring:
  application:
    name: gateway-api
  cloud:
    gateway:
      routes:
        - id: chatgpt-api-microservice
#          uri: http://localhost:8081/
          uri: lb://chatgpt-api-microservice
          predicates:
            - Path=/api/**
        - id: service-two
#          uri: http://localhost:8082/
          uri: lb://service-two
          predicates:
            - Path=/second/**
        - id: mail
#          uri: http://localhost:8083/
          uri: lb://mail
          predicates:
            - Path=/mail/**